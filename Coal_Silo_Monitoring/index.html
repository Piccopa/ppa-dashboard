<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Industrial Plant – 3D Coal Silo Monitoring System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cs.css" />
</head>
<body>
  <!-- ================= HEADER ================= -->
  <header class="hdr">
    <button id="menuBtn" class="btn ikon" title="Menu">☰</button>
    <div class="brand">
      <svg viewBox="0 0 64 64" class="logo" aria-hidden="true">
        <defs><linearGradient id="lg1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs>
        <path d="M14 10 L50 10 L50 42 L36 54 L28 54 L14 42 Z" fill="none" stroke="url(#lg1)" stroke-width="3.5"/>
        <path d="M17 30 Q24 25 32 28 T47 27 L47 41 L35 51 L29 51 L17 41 Z" fill="#111827" stroke="#334155"/>
        <path d="M17 30 Q24 25 32 28 T47 27" fill="none" stroke="#f97316" stroke-width="2.4"/>
        <path d="M14 10 L32 4 L50 10" fill="none" stroke="#67e8f9" stroke-width="3"/>
        <circle cx="32" cy="7" r="2.6" fill="#22d3ee"/><path d="M32 9 L24 27 M32 9 L40 26" stroke="#22d3ee" stroke-width="1" opacity=".7"/>
      </svg>
      <div><h1>SMART INDUSTRIAL PLANT · 3D COAL SILO MONITORING SYSTEM</h1><p>ADVANCED 3D MATERIAL VISUALIZATION · INTELLIGENT INSTRUMENTATION · REAL-TIME MONITORING</p></div>
    </div>
    <div class="hdr-r">
      <span class="sim-badge" title="Semua nilai adalah data simulasi, bukan pengukuran nyata">● SIMULATION</span>
      <div class="ctl">
        <button class="btn kecil c-start" data-ctl="start" title="Jalankan simulasi">▶ START</button>
        <button class="btn kecil c-stop" data-ctl="stop" title="Bekukan simulasi">■ STOP</button>
        <button class="btn kecil" data-ctl="reset" title="Kembali ke data contoh">↺ RESET</button>
        <button class="btn kecil c-auto" data-ctl="auto">AUTO MODE</button>
        <button class="btn kecil c-man" data-ctl="manual">MANUAL MODE</button>
      </div>
      <span class="run-pill" id="hdrRun">–</span>
      <div class="clock"><small>SIM TIME</small><b id="simJam">--:--:--</b><span id="simTgl"></span></div>
      <label class="spd"><small>SPEED</small><select id="speed"><option value="1">1× (real)</option><option value="10">10×</option><option value="60">60×</option><option value="300">300×</option></select></label>
      <div class="clock real"><small>LOCAL</small><b id="realJam">--:--:--</b></div>
      <button id="almBtn" class="alm-sum" title="Alarm aktif: CRITICAL · HIGH · MEDIUM/LOW"><span class="c-crit" id="ac_crit">0</span><span class="c-high" id="ac_high">0</span><span class="c-med" id="ac_med">0</span></button>
    </div>
  </header>

  <!-- ================= MENU + HALAMAN ================= -->
  <div class="wrap">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>

  <!-- ================= BANNER ALARM & MODAL ================= -->
  <footer class="alm-banner" id="banner"></footer>
  <div id="modal"></div>

  <!-- Library (butuh internet saat dibuka) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Kode aplikasi (urutan penting) -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/surface.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/alarms.js"></script>
  <script src="js/comm.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/views2d.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
